services:
  postgresql:
    container_name: beta-olympia-postgresql
    image: docker.io/library/postgres:17.5-bullseye
    environment:
      POSTGRES_USER: ${POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    networks:
      - beta-olympia-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DB_USER} -d ${POSTGRES_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  valkey:
    container_name: beta-olympia-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server /etc/valkey/valkey.conf
    volumes:
      - ./configs/valkey.conf:/etc/valkey/valkey.conf:ro
      - ./data/valkey:/data
    networks:
      - beta-olympia-network
    restart: unless-stopped

  app:
    container_name: beta-olympia-app
    build:
      context: ./backend/app
      dockerfile: Dockerfile
    command: ["sh", "-c", "fastapi run main.py --host 0.0.0.0 --port 8000 > /var/log/olympia/app.log 2>&1"]
    env_file:
      - ./configs/.env
    environment:
      APP_HOST: 0.0.0.0
      FRONTEND_URL: https://olympia-custom.io.vn:8443
      DRIVE_CREDENTIALS_FILE: /app/configs/credentials.json
      POSTGRES_DB_HOST: beta-olympia-postgresql
      POSTGRES_DB_PORT: 5432
      VALKEY_HOST: beta-olympia-valkey
      VALKEY_PORT: 6379
    volumes:
      - ./configs:/app/configs:ro
      - ./logs:/var/log/olympia
    depends_on:
      postgresql:
        condition: service_healthy
      valkey:
        condition: service_started
    networks:
      - beta-olympia-network
    restart: unless-stopped

  frontend:
    container_name: beta-olympia-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
    - VITE_APP_ENV=stage
    depends_on:
      - app
    networks:
      - beta-olympia-network
    restart: unless-stopped

  bgm-bot:
    container_name: beta-olympia-bgm-bot
    build:
      context: .
      dockerfile: backend/discord/Dockerfile
    command: ["sh", "-c", "python bgm_bot.py > /var/log/olympia/bgm.log 2>&1"]
    env_file:
      - ./configs/.env
    volumes:
      - ./logs:/var/log/olympia
    depends_on:
      - valkey
    networks:
      - beta-olympia-network
    restart: unless-stopped

  sfx-bot:
    container_name: beta-olympia-sfx-bot
    build:
      context: .
      dockerfile: backend/discord/Dockerfile
    command: ["sh", "-c", "python sfx_bot.py > /var/log/olympia/sfx.log 2>&1"]
    env_file:
      - ./configs/.env
    volumes:
      - ./logs:/var/log/olympia
    depends_on:
      - valkey
    networks:
      - beta-olympia-network
    restart: unless-stopped

  ping-bot:
    container_name: beta-olympia-ping-bot
    build:
      context: .
      dockerfile: backend/discord/Dockerfile
    command: ["sh", "-c", "python ping_bot.py > /var/log/olympia/ping.log 2>&1"]
    env_file:
      - ./configs/.env
    volumes:
      - ./logs:/var/log/olympia
    depends_on:
      - valkey
    networks:
      - beta-olympia-network
    restart: unless-stopped

  nginx:
    container_name: beta-olympia-nginx
    image: docker.io/library/nginx:1.27-alpine
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    env_file:
      - ./configs/.env
    depends_on:
      - frontend
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./deploy/nginx-entrypoint.sh:/entrypoint.sh:ro
      - ./deploy/nginx-init.conf:/etc/nginx/init.conf:ro
      - ./deploy/nginx-prod.conf.template:/etc/nginx/https.conf.template:ro
      - ./data/certbot/webroot:/var/www/certbot:ro
      # Reuse prod's Let's Encrypt cert (read-only). Cert is valid for any port,
      # so https://olympia-custom.io.vn:8443 works without issuing a new cert.
      # Prod certbot (in /root/OLYMPIA_CUSTOM) handles renewal; stage only reads.
      - /root/OLYMPIA_CUSTOM/data/certbot/certs:/etc/letsencrypt:ro
    networks:
      - beta-olympia-network
    restart: unless-stopped

  certbot:
    container_name: beta-olympia-certbot
    image: docker.io/certbot/certbot:latest
    env_file:
      - ./configs/.env
    depends_on:
      - nginx
    volumes:
      - ./data/certbot/webroot:/var/www/certbot
      - ./data/certbot/certs:/etc/letsencrypt
    entrypoint:
      - /bin/sh
      - -c
      - |
          trap exit TERM
          if [ ! -f /etc/letsencrypt/live/$${DOMAIN}/fullchain.pem ]; then
            until certbot certonly --webroot --webroot-path=/var/www/certbot --email $${CERTBOT_EMAIL} --agree-tos --no-eff-email -d $${DOMAIN}; do
              echo "Cert issuance failed, retrying in 30s..."
              sleep 30
            done
          fi
          while :; do certbot renew --quiet; sleep 12h & wait $${!}; done
    networks:
      - beta-olympia-network
    profiles: ["never"]
    restart: "no"

networks:
  beta-olympia-network:
    driver: bridge