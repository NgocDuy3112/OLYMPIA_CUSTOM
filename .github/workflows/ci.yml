name: CI

on:
  push:
    branches: [main, dev/**]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TS (typecheck + lint + engine tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspaces (shared → db → engine)
        run: pnpm turbo build --filter=@oc/shared --filter=@oc/db --filter=@oc/engine

      - name: Typecheck
        run: pnpm turbo typecheck --filter=@oc/shared --filter=@oc/db --filter=@oc/engine --filter=@oc/api --filter=frontend

      - name: Lint (web — api chưa có eslint config)
        run: pnpm --filter frontend run lint

      - name: Engine tests
        run: pnpm --filter @oc/engine test

  agent:
    name: Agent (pytest + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/ai-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-agent/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Tests
        run: pytest -q
