name: CI

on:
  push:
    branches: [dev/oc-app, stage/oc-app, prod/oc-app]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (api + web)
        run: pnpm --filter @oc/api lint && pnpm --filter frontend lint

      - name: Engine tests
        run: pnpm --filter @oc/engine test

      - name: Build
        run: pnpm build

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4

      - run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .

      - name: Pytest
        run: uv run pytest

  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: olympia
          POSTGRES_PASSWORD: olympia
          POSTGRES_DB: olympia_custom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olympia -d olympia_custom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations in order
        env:
          PGPASSWORD: olympia
        run: |
          for f in migrations/*.sql; do
            echo "Applying $f..."
            psql -h localhost -U olympia -d olympia_custom -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Verify key tables exist
        env:
          PGPASSWORD: olympia
        run: |
          psql -h localhost -U olympia -d olympia_custom -c \
            "SELECT table_name FROM information_schema.tables WHERE table_name IN ('users','matches','tournaments','tournament_phases','bracket_edges') ORDER BY 1;"
