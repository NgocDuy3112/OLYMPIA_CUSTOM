[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    -ra
    --strict-markers
    --strict-config
    --disable-warnings
    --tb=short

[coverage:run]
source = .
omit = 
    */tests/*
    */venv/*
    */.venv/*
    */__pycache__/*
    */alembic/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.: