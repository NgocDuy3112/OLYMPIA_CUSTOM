[project]
name = "oc-ai-agent"
version = "0.1.0"
description = "Olympia Custom — Q&A agent (LangGraph, tool-calling via API)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "httpx>=0.27",
    "langgraph>=0.2",
    "langchain>=1.4",
    "langchain-openrouter>=0.2.9",
    "prometheus-client>=0.26.0",
    "arize-phoenix-otel>=0.17",
    "openinference-instrumentation-langchain>=0.1",
    "opentelemetry-instrumentation-fastapi",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"
