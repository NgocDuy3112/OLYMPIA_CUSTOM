# ─────────────────────────────────────────────────────────────
# Nginx reverse-proxy configuration for OLYMPIA CUSTOM
#
# This file is mounted into the nginx container at:
#   /etc/nginx/conf.d/default.conf
#
# The ${DOMAIN} variable is substituted at runtime by envsubst
# (see deploy/nginx-entrypoint.sh) or you can hardcode it below.
# ─────────────────────────────────────────────────────────────

# ── HTTP → HTTPS redirect ───────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt ACME challenge (served from certbot container)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # ── SSL (certificates managed by certbot container) ─────
    ssl_certificate     /etc/letsencrypt/live/olympia.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/olympia.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Security headers ────────────────────────────────────
    add_header X-Frame-Options        SAMEORIGIN  always;
    add_header X-Content-Type-Options nosniff     always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # ── Frontend static files (Vite build output) ───────────
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Backend REST API ────────────────────────────────────
    location /api/ {
        proxy_pass http://olympia-app:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable request body buffering for file uploads
        client_max_body_size 50M;
    }

    # ── WebSocket ───────────────────────────────────────────
    location /ws/ {
        proxy_pass http://olympia-app:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade              $http_upgrade;
        proxy_set_header Connection           "upgrade";
        proxy_set_header Host                 $host;
        proxy_set_header X-Real-IP            $remote_addr;
        proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto    $scheme;

        # Keep WebSocket connections alive
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Health check (optional, for monitoring) ─────────────
    location /health {
        proxy_pass http://olympia-app:8000/health;
        access_log off;
    }
}
