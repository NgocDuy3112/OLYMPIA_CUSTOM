# ─────────────────────────────────────────────────────────────
# Nginx config for INITIAL Let's Encrypt certificate issuance
#
# Use this BEFORE switching to nginx.conf (when no certs exist).
# Mount this file as the nginx config, start nginx, run certbot,
# then restart nginx with the full nginx.conf.
#
# See deploy/README.md "First-Time TLS Certificate" section.
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge for Let's Encrypt (certbot webroot method)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Serve the frontend so the site is not completely broken
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
