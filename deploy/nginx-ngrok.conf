# ─────────────────────────────────────────────────────────────
# Nginx config for ngrok tunnel (HTTP-only, no TLS)
#
# Usage:
#   1. Start stack:  podman-compose -f docker-compose.staging.yaml \
#                       -f docker-compose.ngrok.yaml up -d --build
#   2. Tunnel:       ngrok http 80
#   3. Build frontend with ngrok URL and restart nginx:
#        NGROK_URL=https://<random>.ngrok-free.app
#        cd frontend && \
#          VITE_API_BASE_URL=$NGROK_URL VITE_WS_BASE_URL=${NGROK_URL/https/wss} \
#          npm run build
#        podman-compose -f docker-compose.staging.yaml \
#                       -f docker-compose.ngrok.yaml restart nginx
#
# ngrok handles TLS externally — nginx only needs HTTP here.
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ── Security headers ────────────────────────────────────
    add_header X-Frame-Options        SAMEORIGIN  always;
    add_header X-Content-Type-Options nosniff     always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # ── Frontend static files (Vite build output) ───────────
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Backend REST API ────────────────────────────────────
    location /api/ {
        proxy_pass http://olympia-app:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Tell the backend the original scheme was https (ngrok provides TLS)
        proxy_set_header X-Forwarded-Proto https;

        # Disable request body buffering for file uploads
        client_max_body_size 50M;
    }

    # ── WebSocket ───────────────────────────────────────────
    location /ws/ {
        proxy_pass http://olympia-app:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade              $http_upgrade;
        proxy_set_header Connection           "upgrade";
        proxy_set_header Host                 $host;
        proxy_set_header X-Real-IP            $remote_addr;
        proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto    https;

        # Keep WebSocket connections alive
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Health check ────────────────────────────────────────
    location /health {
        proxy_pass http://olympia-app:8000/health;
        access_log off;
    }
}
