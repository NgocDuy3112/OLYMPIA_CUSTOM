services:
  # ── Database ──────────────────────────────────────────────
  postgresql:
    container_name: oc-postgresql
    image: docker.io/library/postgres:17.5-bullseye
    environment:
      POSTGRES_USER: ${POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    volumes:
      - ./databases/postgres_data:/var/lib/postgresql/data:U
    networks:
      - oc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DB_USER} -d ${POSTGRES_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Cache + WebSocket pub/sub ─────────────────────────────
  valkey:
    container_name: oc-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: >
      valkey-server
      --requirepass ${VALKEY_PASSWORD}
      --user ${VALKEY_USER} on >${VALKEY_PASSWORD} ~* "&*" +@all
    volumes:
      - ./databases/valkey_data:/data
    networks:
      - oc-network
    restart: unless-stopped

  # ── FastAPI backend ───────────────────────────────────────
  # Built into the image; only configs are mounted for runtime access.
  app:
    container_name: oc-app
    build:
      context: ./backend/app
      dockerfile: Dockerfile
    env_file:
      - ./configs/.env
    environment:
      APP_HOST: 0.0.0.0
      # Keep password-reset and email links public when running on VPS via ngrok.
      FRONTEND_URL: https://${NGROK_DOMAIN}
      # Ensure Google Drive credential lookup works inside the container.
      DRIVE_CREDENTIALS_FILE: /app/configs/credentials.json
      # Explicit service discovery inside the compose network.
      POSTGRES_DB_HOST: postgresql
      POSTGRES_DB_PORT: 5432
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
    volumes:
      - ./configs:/app/configs:ro
    depends_on:
      postgresql:
        condition: service_healthy
      valkey:
        condition: service_started
    networks:
      - oc-network
    restart: unless-stopped

  # ── Frontend ──────────────────────────────────────────────
  # Vite build baked into nginx image; this container already proxies /api and /ws to the backend.
  frontend:
    container_name: oc-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - app
    networks:
      - oc-network
    restart: unless-stopped

  # ── Discord / BGM bot ──────────────────────────────────────
  bgm-bot:
    container_name: bgm-bot
    build:
      context: .
      dockerfile: backend/discord/Dockerfile
    command: ["python", "bgm_bot.py"]
    env_file:
      - ./configs/.env
    volumes:
      - ./audios/bgm:/app/audios/bgm:ro
    depends_on:
      - valkey
    networks:
      - oc-network
    restart: unless-stopped

  sfx-bot:
    container_name: sfx-bot
    build:
      context: .
      dockerfile: backend/discord/Dockerfile
    command: ["python", "sfx_bot.py"]
    env_file:
      - ./configs/.env
    volumes:
      - ./audios/sfx:/app/audios/sfx:ro
    depends_on:
      - valkey
    networks:
      - oc-network
    restart: unless-stopped

  # ── Reverse proxy — ngrok mode (HTTP-only) ────────────────
  # Active when: --profile ngrok
  # ngrok container handles TLS externally; nginx only speaks HTTP.
  nginx-ngrok:
    container_name: oc-nginx
    image: docker.io/library/nginx:1.27-alpine
    profiles: [ngrok]
    command: ["nginx", "-g", "daemon off;"]
    depends_on:
      - frontend
    volumes:
      - ./deploy/nginx-ngrok.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - oc-network
    restart: unless-stopped

  # ── ngrok tunnel (optional) ───────────────────────────────
  # Activate with: --profile ngrok
  # This exposes the frontend container, which already proxies /api and /ws to the app.
  ngrok:
    container_name: oc-ngrok
    image: docker.io/ngrok/ngrok:latest
    profiles: [ngrok]
    command: http frontend:80 --domain=${NGROK_DOMAIN} --log=stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - frontend
    networks:
      - oc-network
    restart: unless-stopped

  # ── Reverse proxy — TLS mode (HTTPS + certbot) ───────────
  # Activate with: --profile tls
  nginx:
    container_name: oc-nginx
    image: docker.io/library/nginx:1.27-alpine
    profiles: [tls]
    command: >
      /bin/sh -c
      "envsubst '$$DOMAIN' < /etc/nginx/templates/default.conf.template
       > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-staging.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks:
      - oc-network
    restart: unless-stopped

  certbot:
    container_name: oc-certbot
    image: docker.io/certbot/certbot:latest
    profiles: [tls]
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Renew certificates every 12 hours.
    entrypoint: >
      /bin/sh -c
      "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"
    networks:
      - oc-network
    restart: unless-stopped

networks:
  oc-network:
    driver: bridge

volumes:
  postgres_data:
  valkey_data:
  certbot_webroot:
  certbot_certs:
