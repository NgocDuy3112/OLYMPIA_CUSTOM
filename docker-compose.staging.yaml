# ─────────────────────────────────────────────────────────────
# OLYMPIA CUSTOM — Production / Staging Compose
#
# Usage:
#   podman compose -f docker-compose.prod.yaml up -d --build
#
# Prerequisites:
#   - configs/.env populated (see configs/.env.example)
#   - frontend/dist/ built locally and copied here
#   - TLS certificates issued (see deploy/README.md Step 5)
# ─────────────────────────────────────────────────────────────

services:

  # ── Database ──────────────────────────────────────────────
  postgresql:
    container_name: postgresql
    image: docker.io/library/postgres:17.5-bullseye
    environment:
      - POSTGRES_USER=${POSTGRES_DB_USER}
      - POSTGRES_PASSWORD=${POSTGRES_DB_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - olympia-network
    restart: unless-stopped

  # ── Cache + WebSocket pub/sub ──────────────────────────────
  valkey:
    container_name: valkey
    image: docker.io/valkey/valkey:9-alpine
    command: >
      valkey-server
      --requirepass ${VALKEY_PASSWORD}
      --user ${VALKEY_USER} on >${VALKEY_PASSWORD} ~* "&*" +@all
    networks:
      - olympia-network
    restart: unless-stopped

  # ── FastAPI backend ────────────────────────────────────────
  # Container named "olympia-app" to match nginx upstream
  app:
    container_name: olympia-app
    build:
      context: ./backend/app
    env_file:
      - ./configs/.env
    depends_on:
      - postgresql
      - valkey
    # Port 8000 is NOT exposed publicly — nginx proxies to it
    networks:
      - olympia-network
    restart: unless-stopped

  # ── Discord / BGM bot ──────────────────────────────────────
  ocee-bot:
    container_name: ocee-bot
    build:
      context: .
      dockerfile: backend/ocee-bot/Dockerfile
    env_file:
      - ./configs/.env
    depends_on:
      - valkey
    networks:
      - olympia-network
    restart: unless-stopped

  # ── Reverse proxy + static file server ────────────────────
  nginx:
    container_name: olympia-nginx
    image: docker.io/library/nginx:1.27-alpine
    # envsubst substitutes ${DOMAIN} in the nginx config template at startup
    command: >
      /bin/sh -c
      "envsubst '$$DOMAIN' < /etc/nginx/conf.d/default.conf.template
       > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf.template:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks:
      - olympia-network
    restart: unless-stopped

  # ── TLS certificate auto-renewal ──────────────────────────
  # For first-time issuance, run manually (see deploy/README.md)
  certbot:
    container_name: olympia-certbot
    image: docker.io/certbot/certbot:latest
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Renew certificates every 12 hours if expiry < 30 days
    entrypoint: >
      /bin/sh -c
      "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"
    networks:
      - olympia-network
    restart: unless-stopped

networks:
  olympia-network:
    driver: bridge

volumes:
  postgres_data:
  certbot_webroot:
  certbot_certs:
