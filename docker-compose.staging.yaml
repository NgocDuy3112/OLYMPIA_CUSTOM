services:
  # ── Database ──────────────────────────────────────────────
  postgresql:
    container_name: oc-postgresql
    image: docker.io/library/postgres:17.5-bullseye
    env_file:
      - ./configs/.env
    volumes:
      - ./databases/postgres_data:/var/lib/postgresql/data:U
    networks:
      - oc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_DB_USER -d $$POSTGRES_DB_NAME"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Cache + WebSocket pub/sub ─────────────────────────────
  valkey:
    container_name: oc-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: ["sh", "-c", "valkey-server --requirepass \"$$VALKEY_PASSWORD\" --user \"$$VALKEY_USER\" on \">$$VALKEY_PASSWORD\" '~*' '&*' +@all"]
    env_file:
      - ./configs/.env
    volumes:
      - ./databases/valkey_data:/data
    networks:
      - oc-network
    restart: unless-stopped

  # ── FastAPI backend ───────────────────────────────────────
  # Built into the image; only configs are mounted for runtime access.
  app:
    container_name: oc-app
    build:
      context: ./backend/app
      dockerfile: Dockerfile
    env_file:
      - ./configs/.env
    environment:
      APP_HOST: 0.0.0.0
      # Keep password-reset and email links public when running on VPS via ngrok.
      FRONTEND_URL: https://${NGROK_DOMAIN}
      # Explicit service discovery inside the compose network.
      POSTGRES_DB_HOST: postgresql
      POSTGRES_DB_PORT: 5432
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
    depends_on:
      postgresql:
        condition: service_healthy
      valkey:
        condition: service_started
    networks:
      - oc-network
    restart: unless-stopped

  # ── Frontend ──────────────────────────────────────────────
  # Vite build baked into nginx image; this container already proxies /api and /ws to the backend.
  frontend:
    container_name: oc-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - app
    networks:
      - oc-network
    restart: unless-stopped

  # ── Discord / BGM bot ──────────────────────────────────────
  bgm-bot:
    container_name: bgm-bot
    build:
      context: .
      dockerfile: backend/discord/Dockerfile
    command: ["python", "bgm_bot.py"]
    env_file:
      - ./configs/.env
    volumes:
      - ./audios/bgm:/app/audios/bgm:ro
    depends_on:
      - valkey
    networks:
      - oc-network
    restart: unless-stopped

  sfx-bot:
    container_name: sfx-bot
    build:
      context: .
      dockerfile: backend/discord/Dockerfile
    command: ["python", "sfx_bot.py"]
    env_file:
      - ./configs/.env
    volumes:
      - ./audios/sfx:/app/audios/sfx:ro
    depends_on:
      - valkey
    networks:
      - oc-network
    restart: unless-stopped

  # ── Reverse proxy (HTTP-only, TLS via ngrok) ─────────────
  nginx-ngrok:
    container_name: oc-nginx
    image: docker.io/library/nginx:1.27-alpine
    command: ["nginx", "-g", "daemon off;"]
    depends_on:
      - frontend
    volumes:
      - ./deploy/nginx-ngrok.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - oc-network
    restart: unless-stopped

  # ── ngrok tunnel ─────────────────────────────────────────
  ngrok:
    container_name: oc-ngrok
    image: docker.io/ngrok/ngrok:latest
    entrypoint: ["sh", "-c"]
    command: ["ngrok http frontend:80 --domain=$$NGROK_DOMAIN --log=stdout"]
    env_file:
      - ./configs/.env
    depends_on:
      - frontend
    networks:
      - oc-network
    restart: unless-stopped

networks:
  oc-network:
    driver: bridge

volumes:
  postgres_data:
  valkey_data:
