services:
  # ── Database ──────────────────────────────────────────────
  postgresql:
    container_name: olympia-postgresql
    image: postgres:17.5-bullseye
    environment:
      POSTGRES_USER: ${POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    volumes:
      - ./database/postgres_data:/var/lib/postgresql/data
    networks:
      - olympia-network
    restart: unless-stopped

  # ── Cache + WebSocket pub/sub ─────────────────────────────
  valkey:
    container_name: olympia-valkey
    image: valkey/valkey:9-alpine
    command: >
      valkey-server
      --requirepass ${VALKEY_PASSWORD}
      --user ${VALKEY_USER} on >${VALKEY_PASSWORD} ~* "&*" +@all
    volumes:
      - ./database/valkey_data:/data
    networks:
      - olympia-network
    restart: unless-stopped

  # ── FastAPI backend ───────────────────────────────────────
  # Built into the image; only configs are mounted for runtime access.
  app:
    container_name: olympia-app
    build:
      context: ./backend/app
      dockerfile: Dockerfile
    env_file:
      - ./configs/.env
    environment:
      APP_HOST: 0.0.0.0
      # Keep password-reset and email links public when running on VPS via ngrok.
      FRONTEND_URL: https://${NGROK_DOMAIN}
      # Ensure Google Drive credential lookup works inside the container.
      DRIVE_CREDENTIALS_FILE: /app/configs/credentials.json
      # Explicit service discovery inside the compose network.
      POSTGRES_DB_HOST: postgresql
      POSTGRES_DB_PORT: 5432
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
    volumes:
      - ./configs:/app/configs:ro
    depends_on:
      - postgresql
      - valkey
    networks:
      - olympia-network
    restart: unless-stopped

  # ── Frontend ──────────────────────────────────────────────
  # Vite build baked into nginx image; this container already proxies /api and /ws to the backend.
  frontend:
    container_name: olympia-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - app
    networks:
      - olympia-network
    restart: unless-stopped

  # ── Discord / BGM bot ─────────────────────────────────────
  bgm-bot:
    container_name: olympia-bgm-bot
    build:
      context: .
      dockerfile: backend/ocee-bot/Dockerfile
    env_file:
      - ./configs/.env
    command: ["python", "bgm_bot.py"]
    volumes:
      - ./audios:/app/audios:ro
    depends_on:
      - valkey
    networks:
      - olympia-network
    restart: unless-stopped

  # ── Discord / SFX bot ─────────────────────────────────────
  sfx-bot:
    container_name: olympia-sfx-bot
    build:
      context: .
      dockerfile: backend/ocee-bot/Dockerfile
    env_file:
      - ./configs/.env
    command: ["python", "sfx_bot.py"]
    volumes:
      - ./audios:/app/audios:ro
    depends_on:
      - valkey
    networks:
      - olympia-network
    restart: unless-stopped

  # ── ngrok tunnel (optional) ───────────────────────────────
  # Activate with: --profile ngrok
  # This exposes the frontend container, which already proxies /api and /ws to the app.
  ngrok:
    container_name: olympia-ngrok
    image: ngrok/ngrok:latest
    command: http frontend:80 --domain=${NGROK_DOMAIN} --log=stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - frontend
    networks:
      - olympia-network
    restart: unless-stopped

  # ── Reverse proxy — TLS mode (HTTPS + certbot) ───────────
  # Activate with: --profile tls
  nginx:
    container_name: olympia-nginx
    image: nginx:1.27-alpine
    profiles: [tls]
    command: >
      /bin/sh -c
      "envsubst '$$DOMAIN' < /etc/nginx/templates/default.conf.template
       > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-staging.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks:
      - olympia-network
    restart: unless-stopped

  certbot:
    container_name: olympia-certbot
    image: certbot/certbot:latest
    profiles: [tls]
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Renew certificates every 12 hours.
    entrypoint: >
      /bin/sh -c
      "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"
    networks:
      - olympia-network
    restart: unless-stopped

networks:
  olympia-network:
    driver: bridge

volumes:
  postgres_data:
  valkey_data:
  certbot_webroot:
  certbot_certs:
