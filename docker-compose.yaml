services:
  postgres:
    container_name: aoc-postgresql
    image: docker.io/library/postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - aoc-postgresql:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    container_name: aoc-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./configs/.env
    environment:
      POSTGRES_HOST: postgres
      LIVEKIT_INTERNAL_URL: http://livekit:7880
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    container_name: aoc-redis
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    volumes:
      - aoc-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    container_name: aoc-livekit
    image: docker.io/livekit/livekit-server:v1.13.11
    restart: unless-stopped
    env_file:
      - ./configs/.env
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cat > /tmp/livekit.yaml <<EOF
        port: 7880
        keys:
          $${LIVEKIT_API_KEY}: $${LIVEKIT_API_SECRET}
        redis:
          address: redis:6379
        rtc:
          node_ip: 127.0.0.1
          udp_port: 7882
          tcp_port: 7881
        EOF
        exec /livekit-server --config /tmp/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7880"]
      interval: 15s
      timeout: 5s
      retries: 5

  egress:
    profiles: ["recordings"]
    container_name: aoc-egress
    image: docker.io/livekit/egress:v1.15.0
    restart: unless-stopped
    env_file:
      - ./configs/.env
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        : "$${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in configs/.env}"
        : "$${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in configs/.env}"
        : "$${S3_ENDPOINT:?set S3_ENDPOINT in configs/.env}"
        : "$${S3_BUCKET:?set S3_BUCKET in configs/.env}"
        cat > /tmp/egress.yaml <<EOF
        logging:
          level: info
        api_key: $${LIVEKIT_API_KEY}
        api_secret: $${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        insecure: true
        redis:
          address: redis:6379
        session_limits:
          file_output_max_duration: 4h
        storage:
          s3:
            access_key: $${S3_ACCESS_KEY_ID}
            secret: $${S3_SECRET_ACCESS_KEY}
            region: $${S3_REGION}
            endpoint: $${S3_ENDPOINT}
            bucket: $${S3_BUCKET}
        EOF
        rm -rf /home/egress/tmp/* || true
        ulimit -n 65536 || true
        rm -rf /var/run/pulse /var/lib/pulse /home/egress/.config/pulse /home/egress/.cache/xdgr/pulse || true
        pulseaudio -D --verbose --exit-idle-time=-1 --disallow-exit >/dev/null 2>&1 || true
        export EGRESS_CONFIG_FILE=/tmp/egress.yaml
        exec egress

volumes:
  aoc-postgresql:
    external: true
  aoc-redis: