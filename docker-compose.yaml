services:
  postgres:
    container_name: oc-postgresql-18
    image: docker.io/library/postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./data/oc-postgresql:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    container_name: oc-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./configs/.env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  # WebRTC SFU for the players' webcams (see docs/rtc-webcams.md). Media flows
  # browser ↔ this container directly; the backend only mints join tokens.
  livekit:
    container_name: oc-livekit
    image: docker.io/livekit/livekit-server:v1.13.11
    restart: unless-stopped
    env_file:
      - ./configs/.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cat > /tmp/livekit.yaml <<EOF
        port: 7880
        keys:
          $${LIVEKIT_API_KEY}: $${LIVEKIT_API_SECRET}
        rtc:
          node_ip: 127.0.0.1
          udp_port: 7882            # ONE mux port for media (not 50000-60000)
          tcp_port: 7881            # ICE-over-TCP fallback
        EOF
        exec /livekit-server --config /tmp/livekit.yaml
    ports:
      - "7880:7880"                 # HTTP + WebSocket signaling
      - "7881:7881/tcp"             # ICE/TCP fallback
      - "7882:7882/udp"             # WebRTC media
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7880"]
      interval: 15s
      timeout: 5s
      retries: 5