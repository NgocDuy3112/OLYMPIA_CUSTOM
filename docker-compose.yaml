services:
  postgresql:
    container_name: postgresql
    image: postgres:17.5-bullseye
    environment:
      - POSTGRES_USER=${POSTGRES_DB_USER}
      - POSTGRES_PASSWORD=${POSTGRES_DB_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB_NAME}
    ports:
      - "${POSTGRES_DB_PORT}:5432"
    env_file:
      - ./configs/.env
    volumes:
      - ./database/postgresql/oc3:/var/lib/postgresql/data
    networks:
      - olympia-custom-network
    profiles:
      - production
      - development

  valkey:
    container_name: valkey
    image: valkey/valkey:9-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./configs/valkey.conf:/configs/valkey.conf
      - ./database/valkey:/data
    command: valkey-server /configs/valkey.conf
    networks:
      - olympia-custom-network
    profiles:
      - production
      - development

  app:
    container_name: app
    build:
      context: ./backend/app
    working_dir: /backend/app
    volumes:
      - ./backend/app:/backend/app
      - ./configs/.env:/backend/app/.env
    environment:
      - ENV_FILE=/backend/app/.env
      - PYTHONPATH=/backend/app
    depends_on:
      postgresql:
        condition: service_started
      valkey:
        condition: service_started
    ports:
      - "8000:8000"
    networks:
      - olympia-custom-network
    profiles:
      - production
      - development

networks:
  olympia-custom-network:
    driver: bridge