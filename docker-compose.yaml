services:
  postgresql:
    container_name: postgresql
    image: postgres:17.5-bullseye
    environment:
      - POSTGRES_USER=${POSTGRES_DB_USER}
      - POSTGRES_PASSWORD=${POSTGRES_DB_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - olympia-custom-network
    profiles:
      - production
      - development

  valkey:
    container_name: valkey
    image: valkey/valkey:9-alpine
    command: >
      valkey-server 
      --requirepass ${VALKEY_PASSWORD}
      --user ${VALKEY_USER} on >${VALKEY_PASSWORD} ~* "&*" +@all
    networks:
      - olympia-custom-network
    profiles:
      - production
      - development

  app:
    container_name: app
    build:
      context: ./backend/app
    env_file:
      - ./configs/.env
    volumes:
      - ./backend/app:/backend/app
    depends_on:
      - postgresql
      - valkey
    ports:
      - "8000:8000"
    networks:
      - olympia-custom-network
    profiles:
      - production
      - development

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./configs/.env
    ports:
      - "8080:80"
    depends_on:
      - app
    networks:
      - olympia-custom-network
    profiles:
      - production
      - development
    restart: unless-stopped

  bgm-bot:
    container_name: bgm-bot
    build:
      context: .
      dockerfile: backend/ocee-bot/Dockerfile
    env_file:
      - ./configs/.env
    command: ["python", "bgm_bot.py"]
    volumes:
      - ./backend/ocee-bot:/app
      - ./audios:/app/audios
    depends_on:
      - valkey
    networks:
      - olympia-custom-network
    profiles:
      - production
      - development
    restart: unless-stopped

  sfx-bot:
    container_name: sfx-bot
    build:
      context: .
      dockerfile: backend/ocee-bot/Dockerfile
    env_file:
      - ./configs/.env
    command: ["python", "sfx_bot.py"]
    volumes:
      - ./backend/ocee-bot:/app
      - ./audios:/app/audios
    depends_on:
      - valkey
    networks:
      - olympia-custom-network
    profiles:
      - production
      - development
    restart: unless-stopped

networks:
  olympia-custom-network:
    driver: bridge

volumes:
  postgres_data:
