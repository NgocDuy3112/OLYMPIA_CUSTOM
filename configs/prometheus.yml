global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "oc-api"
    static_configs:
      - targets: ["app:8000"]
    metrics_path: /metrics

  - job_name: "oc-ai-agent"
    # ai-agentserve OpenMetrics — format duy nhất mang exemplar (traceID)
    scrape_protocols: [OpenMetricsText0.0.1, Text0.0.4]
    static_configs:
      - targets: ["ai-agent:8100"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
