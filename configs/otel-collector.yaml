# OTel Collector — nhận OTLP từ app, fanout traces sang Tempo + Phoenix.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # gRPC sang Tempo — endpoint host:port, không path.
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # HTTP sang Phoenix — endpoint là BASE, collector tự append /v1/traces.
  otlp_http/phoenix:
    endpoint: http://phoenix:6006

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, otlp_http/phoenix]
