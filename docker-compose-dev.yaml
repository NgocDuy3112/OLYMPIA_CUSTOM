services:
  # ── Database ──────────────────────────────────────────────
  postgresql:
    container_name: oc-postgresql
    image: docker.io/library/postgres:17.5-bullseye
    environment:
      POSTGRES_USER: ${POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    networks:
      - oc-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_DB_USER} -d ${POSTGRES_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Cache + WebSocket pub/sub ─────────────────────────────
  valkey:
    container_name: oc-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server /etc/valkey/valkey.conf
    ports:
      - "6379:6379"
    volumes:
      - ./configs/valkey.conf:/etc/valkey/valkey.conf:ro
      - ./data/valkey:/data
    networks:
      - oc-network
    restart: unless-stopped

  # ── Backend API (dev — hot reload) ───────────────────────
  app:
    container_name: oc-app
    mem_limit: 512m
    memswap_limit: 512m
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./configs/.env.infra
      - ./configs/.env.api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_DB_USER}:${POSTGRES_DB_PASSWORD}@${POSTGRES_DB_HOST}:${POSTGRES_DB_PORT}/${POSTGRES_DB_NAME}
    ports:
      - "8000:8000"
      - "8300:8300" # MCP api (chung image)
    volumes:
      - ./apps/api/src:/app/apps/api/src:ro
      - ./packages/db/src:/app/packages/db/src:ro
      - ./configs:/app/configs:ro
      - ./logs:/var/log/olympia
      - ./data/app:/app/data # MCP tokens file (admin cấp qua UI)
    depends_on:
      postgresql:
        condition: service_healthy
      valkey:
        condition: service_started
    networks:
      - oc-network
      # - edge-network
      
  frontend:
    container_name: oc-frontend
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    environment:
      VITE_PROXY_TARGET: http://app:8000
    ports:
      - "4173:4173"
    volumes:
      - ./apps/web/src:/app/apps/web/src:ro
    depends_on:
      - app
    networks:
      - oc-network
      # - edge-network

  # ── AI Agent (OCee — internal only) ───────────────────────
  ai-agent:
    container_name: oc-ai-agent
    mem_limit: 512m
    memswap_limit: 512m
    build:
      context: .
      dockerfile: apps/ai-agent/Dockerfile
    env_file:
      - ./configs/.env.infra
      - ./configs/.env.agent
    environment:
      VALKEY_HOST: ${VALKEY_HOST}
      VALKEY_PORT: ${VALKEY_PORT}
      API_INTERNAL_URL: http://app:8000/api
      PHOENIX_COLLECTOR_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: ocee-ai-agent
    ports:
      - "8100:8100"
    depends_on:
      - valkey
      - app
      - otel-collector
    networks:
      - oc-network

  phoenix:
    container_name: oc-phoenix
    image: docker.io/arizephoenix/phoenix:latest
    environment:
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_WORKING_DIR: /mnt/data
    ports:
      - "6006:6006" # UI + OTLP HTTP
      - "4317:4317" # OTLP gRPC
    volumes:
      - ./data/phoenix:/mnt/data
    networks:
      - oc-network
    restart: unless-stopped

  # ── OTel: Tempo (traces Grafana) + Collector (fanout → Tempo + Phoenix) ──
  # Prod nên pin image version.
  tempo:
    container_name: oc-tempo
    image: docker.io/grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./configs/tempo.yaml:/etc/tempo.yaml:ro
      - ./data/tempo:/var/tempo
    networks:
      - oc-network
    restart: unless-stopped

  otel-collector:
    container_name: oc-otel-collector
    image: docker.io/otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./configs/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318" # OTLP HTTP (host dev)
    depends_on:
      - tempo
      - phoenix
    networks:
      - oc-network
    restart: unless-stopped

  prometheus:
    container_name: oc-prometheus
    image: docker.io/prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - oc-network
    restart: unless-stopped

  grafana:
    container_name: oc-grafana
    image: docker.io/grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    env_file:
      - ./configs/.env.obs
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - oc-network
    restart: unless-stopped

  discord-bot:
    container_name: oc-discord-bot
    mem_limit: 256m
    memswap_limit: 256m
    build:
      context: .
      dockerfile: apps/discord-bot/Dockerfile
    env_file:
      - ./configs/.env.bot
    environment:
      EXECUTOR_PORT: 8200
    ports:
      - "8200:8200"
    depends_on:
      - valkey
    networks:
      - oc-network

networks:
  oc-network:
    driver: bridge
  # edge-network:
  #   external: true
