services:
  # ── Database ──────────────────────────────────────────────
  postgresql:
    container_name: oc-postgresql
    image: docker.io/library/postgres:17.5-bullseye
    environment:
      POSTGRES_USER: ${POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    networks:
      - oc-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_DB_USER} -d ${POSTGRES_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Cache + WebSocket pub/sub ─────────────────────────────
  valkey:
    container_name: oc-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server /etc/valkey/valkey.conf
    ports:
      - "6379:6379"
    volumes:
      - ./configs/valkey.conf:/etc/valkey/valkey.conf:ro
      - ./data/valkey:/data
    networks:
      - oc-network
    restart: unless-stopped

  # ── Backend API (dev — hot reload) ───────────────────────
  app:
    container_name: oc-app
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./configs/.env.infra
      - ./configs/.env.api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_DB_USER}:${POSTGRES_DB_PASSWORD}@${POSTGRES_DB_HOST}:${POSTGRES_DB_PORT}/${POSTGRES_DB_NAME}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/src:/app/apps/api/src:ro
      - ./packages/db/src:/app/packages/db/src:ro
      - ./configs:/app/configs:ro
      - ./logs:/var/log/olympia
    depends_on:
      postgresql:
        condition: service_healthy
      valkey:
        condition: service_started
    networks:
      - oc-network

  # ── Frontend (Vite dev server) ───────────────────────────
  frontend:
    container_name: oc-frontend
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    environment:
      VITE_PROXY_TARGET: http://app:8000
    ports:
      - "4173:4173"
    volumes:
      - ./apps/web/src:/app/apps/web/src:ro
    depends_on:
      - app
    networks:
      - oc-network

  # ── AI Agent (OCee — internal only) ───────────────────────
  ai-agent:
    container_name: oc-ai-agent
    build:
      context: .
      dockerfile: apps/ai-agent/Dockerfile
    env_file:
      - ./configs/.env.infra
      - ./configs/.env.agent
    environment:
      VALKEY_HOST: ${VALKEY_HOST}
      VALKEY_PORT: ${VALKEY_PORT}
      API_INTERNAL_URL: http://app:8000/api
    ports:
      - "8100:8100"
    depends_on:
      - valkey
      - app
    networks:
      - oc-network

  # ── Observability: Prometheus + Grafana ──────────────────
  # Opik Cloud (free 25k spans/tháng): agent đọc OPIK_API_KEY + OPIK_PROJECT_NAME
  # từ env, không cần service riêng trong compose.
  prometheus:
    container_name: oc-prometheus
    image: docker.io/prom/prometheus:v3.1.0
    command: --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - oc-network
    restart: unless-stopped

  grafana:
    container_name: oc-grafana
    image: docker.io/grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    env_file:
      - ./configs/.env.obs
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - oc-network
    restart: unless-stopped

  discord-bot:
    container_name: oc-discord-bot
    build:
      context: .
      dockerfile: apps/discord-bot/Dockerfile
    env_file:
      - ./configs/.env.bot
    environment:
      EXECUTOR_PORT: 8200
    ports:
      - "127.0.0.1:8200:8200"
    depends_on:
      - valkey
    networks:
      - oc-network

networks:
  oc-network:
    driver: bridge
