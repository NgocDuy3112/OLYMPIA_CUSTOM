services:
  postgres:
    container_name: oc-postgresql-18
    image: docker.io/library/postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/oc-postgresql:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    container_name: oc-backend
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./configs/.env
    environment:
      POSTGRES_HOST: postgres
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  portal:
    container_name: oc-portal
    build:
      context: ./frontend
      dockerfile: deploy/portal.Dockerfile
    restart: unless-stopped
    expose: ["80"]

  gameplay:
    container_name: oc-gameplay
    build:
      context: ./frontend
      dockerfile: deploy/gameplay.Dockerfile
    restart: unless-stopped
    expose: ["80"]

  audience:
    container_name: oc-audience
    build:
      context: ./frontend
      dockerfile: deploy/audience.Dockerfile
    restart: unless-stopped
    expose: ["80"]

  proxy:
    container_name: oc-proxy
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - portal
      - gameplay
      - audience
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-ops@olympia-custom.io.vn}
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-backend:3000}
      PORTAL_APP: ${PORTAL_APP:-portal:80}
      GAMEPLAY_APP: ${GAMEPLAY_APP:-gameplay:80}
      AUDIENCE_APP: ${AUDIENCE_APP:-audience:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - oc-caddy-data:/data
      - oc-caddy-config:/config

volumes:
  oc-caddy-data:
  oc-caddy-config:
